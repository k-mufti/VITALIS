# VITALIS settings that must sit at nginx's http level (outside any server block).
# Copy to /etc/nginx/conf.d/vitalis-http.conf

# Request limit for the API: protects the Deepgram / OpenRouter credit from one busy visitor.
limit_req_zone $binary_remote_addr zone=vitalis:10m rate=5r/s;

# WebSocket upgrade only when the browser asks for one.
map $http_upgrade $vitalis_connection {
    default upgrade;
    ''      close;
}
