# VITALIS at https://kareemmuftee.com/vitalis
# Paste these blocks INSIDE the existing `server { ... }` for kareemmuftee.com (the one with
# `listen 443 ssl`), then: sudo nginx -t && sudo systemctl reload nginx
# ^~ keeps the site's own rules for .js / .css / images from catching VITALIS's files.
# Assumes the repo is at /opt/vitalis and the backend runs on 127.0.0.1:8001 (vitalis.service).

location = /vitalis { return 301 /vitalis/; }

# Live data stream and Vitaly's microphone use WebSockets.
location ^~ /vitalis/ws {
    proxy_pass http://127.0.0.1:8001/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $vitalis_connection;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
}

location ^~ /vitalis/api/ {
    limit_req zone=vitalis burst=40 nodelay;   # zone is defined in vitalis-http.conf
    proxy_pass http://127.0.0.1:8001/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $vitalis_connection;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;          # Vitaly's voice streams as it is generated
    proxy_read_timeout 1h;
}

# The app itself: plain files from the repo. Only what the browser needs is served.
location ^~ /vitalis/ {
    alias /opt/vitalis/;
    index index.html;
    location ~ ^/vitalis/(backend|deploy|\.git)(/|$) { return 404; }
    location ~ \.(md|py|env)$ { return 404; }
}
